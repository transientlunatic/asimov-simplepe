{%- assign data = production.meta['data'] -%}
{%- assign likelihood = production.meta['likelihood'] -%}
{%- assign scheduler = production.meta['scheduler'] -%}
{%- assign waveform = production.meta['waveform'] -%}
{%- assign quality = production.meta['quality'] -%}
{%- assign ifos = production.meta['interferometers'] -%}
{%- assign fhigh_val = 1024 -%}
{%- if quality -%}{%- assign fhigh_val = quality['high frequency'] | default: 1024 -%}{%- endif -%}

[pipeline]
trigger_time = {{ production.meta['event time'] }}
trigger_parameters = {{ production.rundir }}/trigger_parameters.json
outdir = {{ production.rundir }}

{#- simple_pe_pipe's config-file handling (pesummary.core.cli.actions
   .ConfigAction, confirmed directly from the real installed source) does
   its own ad-hoc ini-to-dict parsing wherever a value contains ":" or
   "{" -- NOT argparse's own nargs='+' machinery, despite --help
   describing these as space-separated CLI tokens (that description is
   only accurate for real command-line invocation). Its dict_from_str()
   requires the whole value wrapped in braces, and -- confirmed directly
   against the real pesummary parser -- cannot handle a colon *inside* a
   dict value at all (only as the key:value separator), so channel names
   must NOT repeat the "IFO:" prefix already used as the dict key (per
   --help's own example: `--channels H1:HWINJ_INJECTED`, not
   `H1:H1:HWINJ_INJECTED`). #}
channels = {% raw %}{{% endraw %}{% for ifo in ifos %}{{ ifo }}:{{ data['channels'][ifo] | replace(ifo ~ ':', '') }}{% if not loop.last %},{% endif %}{% endfor %}{% raw %}}{% endraw %}
asd = {% raw %}{{% endraw %}{% for ifo in ifos %}{{ ifo }}:{{ data['asd'][ifo] }}{% if not loop.last %},{% endif %}{% endfor %}{% raw %}}{% endraw %}
{%- if pipeline.uses_injection %}

{#- Required unconditionally by simple_pe_datafind whenever any channel is
   INJ -- confirmed directly from its real source: the per-ifo channel
   loop's `elif "inj" in value.lower():` branch calls
   `os.path.isfile(opts.injection)` with no guard against `opts.injection`
   being its `None` default, raising a bare TypeError instead of the
   intended FileNotFoundError if this isn't passed -- confirmed via this
   plugin's own e2e CI. Written by before_config()/
   _write_injection_parameters(). #}
injection = {{ production.rundir }}/injection.json
{%- endif %}

approximant = {{ waveform['approximant'] }}
f_low = {{ likelihood['minimum frequency'][ifos[0]] }}
f_high = {{ fhigh_val }}

{#- --peak_finder defaults to [] (confirmed directly from --help), and
   simple_pe_pipe's main() builds the actual analysis DAG nodes
   (FilterNode/AnalysisNode/CornerNode/PostProcessingNode) inside `for
   peak_finder in opts.peak_finder:` -- with an empty list that loop runs
   zero times, so those nodes silently never get created at all (the DAG
   ends up containing only the DataFindNode job). Confirmed directly via
   this plugin's own e2e CI: a real run produced a working, single-node
   DAG with no error of any kind, which is what made this so easy to
   miss -- there's no crash to point at it. `metric` matches simple-pe's
   own Fisher-matrix design (its headline algorithm, per --help's
   examples) and is used here as the default. #}
peak_finder = {{ production.meta['peak_finder'] | default: 'metric' }}

accounting_group = {{ scheduler['accounting group'] }}
accounting_group_user = {{ config['condor']['user'] }}

generate_corner = True

{#- --disable_pesummary defaults to False (confirmed directly from
   --help), and simple_pe_pipe's main() adds a PostProcessingNode as a
   child of the analysis job whenever it's False -- a full PESummary
   post-processing/report stage baked directly into simple-pe's own DAG
   (confirmed directly from its real main() source, dumped via this
   plugin's own e2e CI). Left at its default, this would run PESummary
   twice: once here, inside simple-pe's own DAG, and again in whatever
   separate, needs:-linked PESummary production picks up this
   production's samples via collect_assets() -- the normal Asimov
   pattern this plugin follows (see README's Post-processing section),
   matching asimov-pycbc/asimov-lalinference. Setting this True defers
   post-processing entirely to that downstream production, as intended.
   Unrelated to (and no workaround for) the separate, unconditional
   pesummary-based reweighting inside the analysis node itself that
   currently crashes against real GWOSC data -- see CHANGELOG.md. #}
disable_pesummary = True
