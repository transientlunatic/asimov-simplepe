# Test blueprint for the real Simple-PE production under test. Its ini is
# rendered from asimov_simplepe's bundled config_template (see e2e.yml).
#
# `data.channels.<IFO>: GWOSC` is simple_pe_pipe's own documented magic
# value (confirmed directly from its real --help text) for reading real,
# public GWOSC strain data instead of a private frame channel -- paired
# with `event time: 1126259462.4` (GW150914's real GPS time, set on
# fake_event.yaml) and the `trigger`/`waveform` parameters below (GW150914's
# real published values), this analyses a real historical event's real
# detector data. This is deliberate, not incidental: `data.channels: INJ`
# (simulate an injection instead) was tried first and hits a genuine,
# currently-unworkaroundable upstream bug -- simple_pe_datafind's
# write_converted_injection_parameters() wraps the injection dict in
# SimplePESamples (a pesummary-style samples container built for posterior
# *chains*), and passing that into a later NumPy/LALSuite computation
# eventually produces a NaN GPS time that sends LALSuite's
# XLALGPSSetREAL8() into what is for all practical purposes an infinite
# loop -- confirmed directly via this plugin's own e2e CI (see
# CHANGELOG.md's "Fixed" entry for the full trail). GWOSC mode never calls
# write_converted_injection_parameters() at all, sidestepping that code
# path entirely -- and is arguably the more meaningful test besides.
#
# `data.asd` must be a real ASD file path -- confirmed directly from
# `--help` ("ASD files to use for the analysis") and from a real e2e run:
# there is no analytic-PSD-model magic value (an earlier attempt using the
# model name `aLIGOZeroDetHighPower` as if it were one crashed with
# `FileNotFoundError: aLIGOZeroDetHighPower not found.`, because
# simple_pe_datafind opens whatever string it's given as a literal path).
# Generated by e2e.yml's "Generate a real ASD file for the e2e test" step,
# from pycbc's own analytic aLIGOZeroDetHighPower model, before this
# blueprint is applied -- still needed here: the PSD is used to weight the
# Fisher-matrix/SNR calculation regardless of where the strain data itself
# comes from. Written under $GITHUB_WORKSPACE/e2e_project (hardcoded here
# to this CI environment's real, consistently-observed
# /__w/<repo>/<repo>/e2e_project path, since this static YAML file can't
# itself expand $GITHUB_WORKSPACE), not /tmp: a real e2e run confirmed the
# `filter` DAG node (unlike `datafind`, which declares `universe =
# "local"` and so shares the submit host's normal filesystem) can't see
# /tmp at all -- consistent with HTCondor's default (non-local-universe)
# jobs running in a sandboxed execute directory that doesn't include /tmp.
# Two detectors, not one -- see fake_event.yaml's comment for why that
# matters here.
kind: analysis
name: simplepe-test
pipeline: simplepe
comment: Simple-PE end-to-end test production (real GW150914 data via GWOSC)
status: ready
trigger:
  mass1: 36
  mass2: 29
  spin1z: 0.0
  spin2z: 0.0
  ra: 1.95
  dec: -1.27
  distance: 440
  phase: 0
  psi: 0
likelihood:
  minimum frequency:
    H1: 20
    L1: 20
data:
  channels:
    H1: GWOSC
    L1: GWOSC
  asd:
    H1: /__w/asimov-simplepe/asimov-simplepe/e2e_project/aLIGO_asd.txt
    L1: /__w/asimov-simplepe/asimov-simplepe/e2e_project/aLIGO_asd.txt
scheduler:
  accounting group: ligo.dev.o4.cbc.pe.simple_pe
