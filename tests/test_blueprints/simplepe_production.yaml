# Test blueprint for the real Simple-PE production under test. Its ini is
# rendered from asimov_simplepe's bundled config_template (see e2e.yml).
# `data.channels.<IFO>: INJ` is simple_pe_pipe's own documented magic
# value (confirmed directly from its real --help text) for "simulate an
# injection instead of reading real strain data" -- a literal channel
# name here (this plugin's first attempt) is read as a real channel to
# look up via datafind, which is why a real e2e run hung for the full
# job timeout: its datafind node was trying to reach a real datafind
# service that doesn't exist in this sandboxed HTCondor container.
# `data.asd` must be a real ASD file path -- confirmed directly from
# `--help` ("ASD files to use for the analysis") and from a real e2e
# run: there is no analytic-PSD-model magic value (an earlier attempt
# using the model name `aLIGOZeroDetHighPower` as if it were one crashed
# with `FileNotFoundError: aLIGOZeroDetHighPower not found.`, because
# simple_pe_datafind opens whatever string it's given as a literal
# path). `/tmp/aLIGO_asd.txt` is generated by e2e.yml's "Generate a real
# ASD file for the e2e test" step, from pycbc's own analytic
# aLIGOZeroDetHighPower model, before this blueprint is applied. Two
# detectors, not one -- see fake_event.yaml's comment for why that
# matters here.
kind: analysis
name: simplepe-test
pipeline: simplepe
comment: Simple-PE end-to-end test production (simulated noise)
status: ready
trigger:
  mass1: 36
  mass2: 29
  spin1z: 0.0
  spin2z: 0.0
  ra: 1.95
  dec: -1.27
  distance: 440
  phase: 0
  psi: 0
likelihood:
  minimum frequency:
    H1: 20
    L1: 20
data:
  channels:
    H1: INJ
    L1: INJ
  asd:
    H1: /tmp/aLIGO_asd.txt
    L1: /tmp/aLIGO_asd.txt
scheduler:
  accounting group: ligo.dev.o4.cbc.pe.simple_pe
